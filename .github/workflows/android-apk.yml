name: Fire TV APK

# Run from the Actions tab ("Run workflow"), or push a tag like tv-v0.1.0 to also publish a Release.
on:
  workflow_dispatch:
  push:
    tags: ['tv-v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk jellyfin-music-firetv.apk
      - uses: actions/upload-artifact@v4
        with:
          name: jellyfin-music-firetv
          path: jellyfin-music-firetv.apk
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/tv-v')
        uses: softprops/action-gh-release@v2
        with:
          files: jellyfin-music-firetv.apk
